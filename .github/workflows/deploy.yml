name: Deploy React Project to Hostinger Subfolder

on:
  push:
    branches:
      - main # Veya projenizin ana dalı 'master' ise 'master' yazın

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Kodları depodan çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js ortamını kur
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Bağımlılıkları yükle ve Build al
      - name: Install Dependencies & Build React App
        run: |
          npm ci
          npm run build

      # 4. Derlenen çıktıları (dist) Hostinger'daki hedef klasöre aktar
      - name: Deploy via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger üzerindeki hedef alt klasörünüz:
          server-dir: /htdocs/Websitelerim/React_Projelerim/Currency/
          # Vite kullanıyorsanız derleme çıktısı './dist/' klasörüne oluşur.
          # (Eğer Create React App kullanıyorsanız burayı './build/' yapın)
          local-dir: ./dist/